name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Buat kerangka Android (dibuat otomatis oleh Flutter)
        run: |
          flutter create --platforms=android --org id.beyxstok --project-name beyx_stok /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Izin internet dan nama aplikasi
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Beyblade X Stok"#' "$M"
          grep -n "INTERNET\|android:label" "$M"

      - run: flutter pub get

      - name: Analisis kode (tidak menggagalkan build)
        run: flutter analyze
        continue-on-error: true

      - name: Tes unit (tidak menggagalkan build)
        run: flutter test
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: beyx-stok-apk
          path: build/app/outputs/flutter-apk/app-release.apk